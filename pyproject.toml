[build-system]
requires = [
    "scikit-build-core>=1.1.1",
    "nanobind>=3.1.0",
    "packaging>=26.3",
]
build-backend = "scikit_build_core.build"

[project]
name = "llama-cpp-nanobind"
version = "0.6.0"
description = "Terminal chat app and high-performance nanobind bindings for llama.cpp"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "llama-cpp-nanobind" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
keywords = [
    "llama",
    "llama.cpp",
    "llm",
    "chat",
    "cli",
    "inference",
    "nanobind",
    "cuda",
    "ai",
    "machine-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0"]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "build>=1.6.1",
    "black>=26.10.1",
    "ruff>=0.17.0",
    "mypy>=2.4.0",
    "isort>=9.0.2",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "gguf>=0.19.0",
    "requests>=2.34.2",
    "types-requests>=2.33.0.20261006",
    "beautifulsoup4>=4.15.0",
    "markdownify>=1.2.3",
]

[project.urls]
Homepage = "https://github.com/pplmx/llama-cpp-nanobind"
Repository = "https://github.com/pplmx/llama-cpp-nanobind"
Issues = "https://github.com/pplmx/llama-cpp-nanobind/issues"

[project.scripts]
llama-chat = "llama_cpp.cli:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.26"
cmake.build-type = "Release"
wheel.packages = ["src/llama_cpp"]
sdist.include = ["examples", "tests"]
sdist.exclude = ["models"]
ninja.make-fallback = true
install.components = ["python"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["llama_cpp"]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.mypy]
strict = true
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
files = ["src/llama_cpp", "examples", "tools", "tests/typing"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"

[[tool.mypy.overrides]]
# nanobind's compiled implementation has no stubs; the Python facade is typed.
module = "llama_cpp._llama"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.isort]
profile = "black"
known_first_party = ["llama_cpp"]
force_single_line = false
combine_as_imports = true
